<div class="panel">
  <div class="panel-title">Your text</div>
  <textarea id="tool-input" placeholder="Type or paste text to count characters..." style="min-height:200px;font-family:var(--font-body);"></textarea>
  <div class="stat-grid" id="tool-stats"></div>
</div>
<div class="panel">
  <div class="panel-title">Result</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Start typing to see the character count.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy summary</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
