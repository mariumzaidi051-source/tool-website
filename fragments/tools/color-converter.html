<div class="panel">
  <div class="panel-title">Pick or enter a color</div>
  <div class="row" style="align-items:flex-end;">
    <div class="field">
      <label for="cc-picker">Color picker</label>
      <input type="color" id="cc-picker" value="#2e6bff" style="height:44px;padding:4px;">
    </div>
    <div class="field">
      <label for="cc-hex">HEX</label>
      <input type="text" id="cc-hex" placeholder="#2E6BFF">
    </div>
  </div>
  <div class="row">
    <div class="field"><label for="cc-rgb">RGB</label><input type="text" id="cc-rgb" placeholder="rgb(46, 107, 255)"></div>
    <div class="field"><label for="cc-hsl">HSL</label><input type="text" id="cc-hsl" placeholder="hsl(222, 100%, 60%)"></div>
  </div>
  <div class="error-msg" id="tool-error">That doesn't look like a valid color value.</div>
  <div style="height:70px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:6px;" id="cc-swatch"></div>
</div>
<div class="panel">
  <div class="panel-title">All formats</div>
  <div class="result-box" id="tool-output" aria-live="polite"></div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy all</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
