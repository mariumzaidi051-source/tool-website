<div class="panel">
  <div class="panel-title">Your JSON</div>
  <textarea id="tool-input" placeholder='{"example": "paste your JSON here"}' style="min-height:220px;"></textarea>
  <div class="row" style="margin-top:12px;">
    <div class="field" style="margin-bottom:0;">
      <label for="json-indent">Indentation</label>
      <select id="json-indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>
  </div>
  <div class="error-msg" id="tool-error"></div>
</div>
<div class="panel">
  <div class="panel-title">Formatted result</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Paste JSON above to format it.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-download">Download .json</button>
    <button class="btn btn-sm" id="btn-minify">Minify instead</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
