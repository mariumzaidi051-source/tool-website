<div class="panel">
  <div class="panel-title">Your JSON</div>
  <textarea id="tool-input" placeholder='Paste JSON here to check if it is valid...' style="min-height:240px;"></textarea>
</div>
<div class="panel">
  <div class="panel-title">Validation result</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Paste JSON above to validate it.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
