<div class="panel">
  <div class="panel-title">Your content</div>
  <textarea id="tool-input" placeholder="Paste your article or page content here..." style="min-height:220px;font-family:var(--font-body);"></textarea>
  <div class="row" style="margin-top:12px;">
    <div class="field" style="margin-bottom:0;">
      <label for="kd-mode">Show</label>
      <select id="kd-mode"><option value="1">Single words</option><option value="2">Two-word phrases</option></select>
    </div>
  </div>
</div>
<div class="panel">
  <div class="panel-title">Top keywords</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Paste content above to see keyword density.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
