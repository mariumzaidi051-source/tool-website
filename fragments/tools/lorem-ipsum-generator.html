<div class="panel">
  <div class="panel-title">Options</div>
  <div class="row">
    <div class="field">
      <label for="li-unit">Generate by</label>
      <select id="li-unit"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select>
    </div>
    <div class="field">
      <label for="li-count">Amount</label>
      <input type="number" id="li-count" value="3" min="1" max="50">
    </div>
  </div>
  <div class="checkbox-row"><input type="checkbox" id="li-classic" checked><label for="li-classic">Start with "Lorem ipsum dolor sit amet..."</label></div>
</div>
<div class="panel">
  <div class="panel-title">Generated text</div>
  <div class="result-box" id="tool-output" aria-live="polite"></div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-download">Download .txt</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
