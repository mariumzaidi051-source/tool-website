<div class="panel">
  <div class="panel-title">Page details</div>
  <div class="field">
    <label for="mt-title">Page title</label>
    <input type="text" id="mt-title" placeholder="e.g. TOLVEXA — Everything You Need in One Place" maxlength="70">
    <span class="hint" id="mt-title-count">0 / 60 recommended characters</span>
  </div>
  <div class="field">
    <label for="mt-desc">Meta description</label>
    <textarea id="mt-desc" placeholder="A short, compelling summary of the page..." style="min-height:90px;font-family:var(--font-body);" maxlength="200"></textarea>
    <span class="hint" id="mt-desc-count">0 / 160 recommended characters</span>
  </div>
  <div class="row">
    <div class="field"><label for="mt-url">Page URL</label><input type="text" id="mt-url" placeholder="https://example.com/page"></div>
    <div class="field"><label for="mt-image">Image URL (for social sharing)</label><input type="text" id="mt-image" placeholder="https://example.com/image.jpg"></div>
  </div>
  <div class="field"><label for="mt-site">Site name</label><input type="text" id="mt-site" placeholder="e.g. TOLVEXA"></div>
</div>
<div class="panel">
  <div class="panel-title">Generated tags</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Fill in the fields above to generate meta tags.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-download">Download .html</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
