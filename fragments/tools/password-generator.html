<div class="panel">
  <div class="panel-title">Options</div>
  <div class="field">
    <label for="pw-length">Length: <span id="pw-length-val">16</span></label>
    <input type="range" id="pw-length" min="6" max="64" value="16">
  </div>
  <div class="checkbox-row"><input type="checkbox" id="pw-upper" checked><label for="pw-upper">Uppercase letters (A–Z)</label></div>
  <div class="checkbox-row"><input type="checkbox" id="pw-lower" checked><label for="pw-lower">Lowercase letters (a–z)</label></div>
  <div class="checkbox-row"><input type="checkbox" id="pw-numbers" checked><label for="pw-numbers">Numbers (0–9)</label></div>
  <div class="checkbox-row"><input type="checkbox" id="pw-symbols"><label for="pw-symbols">Symbols (!@#$%...)</label></div>
  <div class="checkbox-row"><input type="checkbox" id="pw-similar"><label for="pw-similar">Exclude similar characters (l, 1, I, O, 0)</label></div>
  <div class="error-msg" id="tool-error">Please select at least one character type.</div>
</div>
<div class="panel">
  <div class="panel-title">Generated password</div>
  <div class="result-box" id="tool-output" style="font-size:1.1rem;letter-spacing:0.02em;" aria-live="polite"></div>
  <div class="stat-grid" id="tool-stats" style="grid-template-columns:1fr;"></div>
  <div class="result-actions">
    <button class="btn btn-sm btn-primary" id="btn-generate">Generate new</button>
    <button class="btn btn-sm" id="btn-copy">Copy password</button>
    <button class="btn btn-sm" id="btn-share">Share</button>
  </div>
</div>
