<div class="panel">
  <div class="panel-title">Upload a PDF</div>
  <div class="dropzone" id="pdf-dropzone" tabindex="0" role="button" aria-label="Upload a PDF file">
    <p><strong>Click to choose a PDF file</strong> or drag and drop it here.</p>
  </div>
  <input type="file" id="pdf-file-input" accept="application/pdf" class="visually-hidden">
  <div class="file-chip-list" id="pdf-file-list"></div>
  <div class="error-msg" id="tool-error">That PDF could not be read. It may be corrupted or password-protected.</div>
</div>
<div class="panel">
  <div class="panel-title">Result</div>
  <div class="stat-grid" id="tool-stats"></div>
  <div class="result-box empty" id="tool-output" aria-live="polite" style="margin-top:14px;">Upload a PDF to count its pages.</div>
</div>
