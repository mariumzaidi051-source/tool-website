<div class="panel">
  <div class="panel-title">Upload a PDF</div>
  <div class="dropzone" id="pdf-dropzone" tabindex="0" role="button" aria-label="Upload a PDF file">
    <p><strong>Click to choose a PDF file</strong> or drag and drop it here.</p>
  </div>
  <input type="file" id="pdf-file-input" accept="application/pdf" class="visually-hidden">
  <div class="file-chip-list" id="pdf-file-list"></div>
  <div class="field" style="margin-top:14px;">
    <label for="split-range">Pages to extract</label>
    <input type="text" id="split-range" placeholder="e.g. 1-3, 5, 8-10" disabled>
    <span class="hint" id="split-hint">Upload a PDF to see its page count.</span>
  </div>
  <div class="error-msg" id="tool-error">Please enter a valid page range within the document.</div>
</div>
<div class="panel">
  <div class="panel-title">Extract</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Upload a PDF and choose pages to extract.</div>
  <div class="result-actions">
    <button class="btn btn-sm btn-primary" id="btn-split">Extract &amp; download</button>
    <button class="btn btn-sm" id="btn-reset">Clear</button>
  </div>
</div>
