<div class="panel">
  <div class="panel-title">Calculate</div>
  <div class="field">
    <label for="pc-mode">What do you want to work out?</label>
    <select id="pc-mode">
      <option value="of">What is X% of Y?</option>
      <option value="isWhatPercent">X is what percent of Y?</option>
      <option value="change">Percentage change from X to Y</option>
    </select>
  </div>
  <div class="row">
    <div class="field">
      <label for="pc-x" id="pc-x-label">X (percent)</label>
      <input type="number" id="pc-x" placeholder="e.g. 20" inputmode="decimal">
    </div>
    <div class="field">
      <label for="pc-y" id="pc-y-label">Y (value)</label>
      <input type="number" id="pc-y" placeholder="e.g. 150" inputmode="decimal">
    </div>
  </div>
  <div class="error-msg" id="tool-error">Please enter valid numbers in both fields.</div>
</div>
<div class="panel">
  <div class="panel-title">Result</div>
  <div class="result-box empty" id="tool-output" aria-live="polite">Enter numbers above to see the result.</div>
  <div class="result-actions">
    <button class="btn btn-sm" id="btn-copy">Copy result</button>
    <button class="btn btn-sm" id="btn-reset">Reset</button>
    <button class="btn btn-sm" id="btn-share">Share result</button>
  </div>
</div>
